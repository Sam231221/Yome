name: Deploy Services

on:
  workflow_dispatch:
  push:
    branches: [production]
    paths:
      - "services/**"
      - "packages/**"
      - "Dockerfile.service"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: "@services/gateway"
            service_dir: "services/gateway"
            image_name: "yome-gateway"
          - service: "@services/identity"
            service_dir: "services/identity"
            image_name: "yome-identity"
          - service: "@services/core"
            service_dir: "services/core"
            image_name: "yome-core"
          - service: "@services/messaging"
            service_dir: "services/messaging"
            image_name: "yome-messaging"
          - service: "@services/media"
            service_dir: "services/media"
            image_name: "yome-media"
          - service: "@services/notifications"
            service_dir: "services/notifications"
            image_name: "yome-notifications"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx turbo run build --filter=${{ matrix.service }}
      # GHCR rejects image names with uppercase letters, and the owner (e.g. "Sam231221")
      # often has them, so lowercase it once and reuse it for both tags.
      - name: Compute lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.service
          push: true
          build-args: |
            SERVICE_DIR=${{ matrix.service_dir }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image_name }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image_name }}:latest
