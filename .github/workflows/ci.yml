name: CI

on:
  pull_request:
  push:
    branches: [main, production]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      services: ${{ steps.filter.outputs.services }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            mobile:
              - 'apps/mobile/**'
            services:
              - 'services/**'
            packages:
              - 'packages/**'
              - 'turbo.json'
              - 'package.json'

  quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.services == 'true' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run check-types
      - run: bun run test

  build-web:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx turbo run build --filter=@apps/web

  build-mobile:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx turbo run build --filter=@apps/mobile

  build-services:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.services == 'true' || needs.changes.outputs.packages == 'true'
    strategy:
      matrix:
        service:
          - "@services/gateway"
          - "@services/auth"
          - "@services/chat"
          - "@services/media"
          - "@services/notifications"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx turbo run build --filter=${{ matrix.service }}
