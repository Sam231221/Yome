# Local infrastructure for Yome development.
#
#   docker compose up -d        # start Postgres + Redis
#   docker compose down         # stop (keeps volumes)
#   docker compose down -v      # stop and wipe data
#
# The app still reads one root .env. To use this local Postgres instead of a
# remote (e.g. Supabase), point DATABASE_URL / DIRECT_URL at:
#   postgresql://yome:yome@localhost:5440/yome
# (mapped to 5440 on the host since a native Postgres install already owns 5432)
#
# Redis backs services/messaging's presence + Socket.IO fan-out and services/gateway's rate
# limiter (@repo/cache, added in B11). Point REDIS_URL at this instance for local dev.

services:
  postgres:
    image: postgres:16-alpine
    container_name: yome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yome
      POSTGRES_PASSWORD: yome
      POSTGRES_DB: yome
    ports:
      - "5440:5432"
    volumes:
      - yome-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yome -d yome"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yome-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - yome-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yome-postgres-data:
  yome-redis-data:
