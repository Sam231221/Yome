# Local development: PostgreSQL for Prisma migrations and app runtime.
# Usage: docker compose up -d
# Then set in .env:
#   DATABASE_URL="postgresql://yome:yome@localhost:5432/yome"
#   DIRECT_URL="postgresql://yome:yome@localhost:5432/yome"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yome
      POSTGRES_PASSWORD: yome
      POSTGRES_DB: yome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yome -d yome"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
