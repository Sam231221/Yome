# Local development: full stack (Postgres, Redis, gateway, auth, chat, media, notifications).
# Usage: docker compose up -d
# Then set in .env:
#   DATABASE_URL="postgresql://yome:yome@localhost:5432/yome"
#   DIRECT_URL="postgresql://yome:yome@localhost:5432/yome"
#   AUTH_SERVICE_URL=http://auth:4101
#   USER_SERVICE_URL=http://user:4102
#   CHAT_SERVICE_URL=http://chat:4103
#   MEDIA_SERVICE_URL=http://media:4104
#   NOTIFICATIONS_SERVICE_URL=http://notifications:4105

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yome
      POSTGRES_PASSWORD: yome
      POSTGRES_DB: yome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yome -d yome"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/auth
    ports:
      - "4101:4101"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yome:yome@postgres:5432/yome
      DIRECT_URL: postgresql://yome:yome@postgres:5432/yome
    depends_on:
      postgres:
        condition: service_healthy

  user:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/user
    ports:
      - "4102:4102"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yome:yome@postgres:5432/yome
      DIRECT_URL: postgresql://yome:yome@postgres:5432/yome
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/chat
    ports:
      - "4103:4103"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yome:yome@postgres:5432/yome
      DIRECT_URL: postgresql://yome:yome@postgres:5432/yome
    depends_on:
      postgres:
        condition: service_healthy

  media:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/media
    ports:
      - "4104:4104"
    env_file: .env
    depends_on: []

  notifications:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/notifications
    ports:
      - "4105:4105"
    env_file: .env
    depends_on: []

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/gateway
    ports:
      - "4100:4100"
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth:4101
      USER_SERVICE_URL: http://user:4102
      CHAT_SERVICE_URL: http://chat:4103
      MEDIA_SERVICE_URL: http://media:4104
      NOTIFICATIONS_SERVICE_URL: http://notifications:4105
    depends_on:
      - auth
      - user
      - chat
      - media
      - notifications

volumes:
  postgres_data:
